name: EWP
options:
  bundleIdPrefix: com.unlikeotherai.ewp
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  EWP:
    type: application
    platform: iOS
    sources: [EWP, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: EWP/Info.plist
      properties:
        CFBundleDisplayName: EWP
        EWPKeychainGroup: $(AppIdentifierPrefix)com.unlikeotherai.ewp
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: EWP advertises its own MCP server and discovers keyboards on your local network.
        NSBluetoothAlwaysUsageDescription: EWP configures your ESP32's Wi-Fi connection over Bluetooth.
        NSBonjourServices: ['_mcp._tcp']
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: EWP/EWP.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.unlikeotherai.ewp']
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp.Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: EWP Screen Sharing
        NSLocalNetworkUsageDescription: EWP shares this screen directly with your MCP client on the local network.
        NSBonjourServices: ['_mcp._tcp']
        EWPKeychainGroup: $(AppIdentifierPrefix)com.unlikeotherai.ewp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.unlikeotherai.ewp']
  EWPTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EWPTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp.Tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: EWP
  EWPUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EWPUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp.UITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EWP
    dependencies:
      - target: EWP
schemes:
  EWP:
    build:
      targets:
        EWP: all
    test:
      targets: [EWPTests, EWPUITests]
