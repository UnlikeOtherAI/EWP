name: EWP
options:
  bundleIdPrefix: com.unlikeotherai.ewp
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
targets:
  EWP:
    type: application
    platform: iOS
    sources: [EWP, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp
    info:
      path: EWP/Info.plist
      properties:
        CFBundleDisplayName: EWP
        EWPKeychainGroup: $(AppIdentifierPrefix)com.unlikeotherai.ewp
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: EWP finds your ESP32 and sends screen frames to your local MCP bridge.
        NSBluetoothAlwaysUsageDescription: EWP configures your ESP32's Wi-Fi connection over Bluetooth.
        NSBonjourServices: ['_ewp._tcp', '_ewpbridge._tcp']
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: EWP/EWP.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.unlikeotherai.ewp']
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.unlikeotherai.ewp.Broadcast
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: EWP Screen Sharing
        EWPKeychainGroup: $(AppIdentifierPrefix)com.unlikeotherai.ewp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.unlikeotherai.ewp']
schemes:
  EWP:
    build:
      targets:
        EWP: all
