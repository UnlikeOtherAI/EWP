; A second ESP32 that plays the part of a phone: a BLE central that finds the
; keyboard, connects and bonds. It exists so the pairing path can be tested
; without a human tapping a dialog, which is the one step iOS will never let an
; agent take. It is a test rig, not a product target.
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@2.3.6
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -D CONFIG_BT_NIMBLE_MAX_BONDS=8
  -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
