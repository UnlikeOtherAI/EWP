[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@2.3.6
  bblanchon/ArduinoJson@7.4.2
# Each bonded host stores two to four CCCDs, so the CCCD store has to grow with
# the bonds or NimBLE's store runs out and the firmware has to refuse writes to
# it. MAX_CONNECTIONS stays at three because the Arduino framework ships a
# precompiled controller built with CONFIG_BTDM_CTRL_BLE_MAX_CONN=3; raising the
# host side alone only reserves host memory the controller will never use.
build_flags =
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -D CONFIG_BT_NIMBLE_MAX_BONDS=8
  -D CONFIG_BT_NIMBLE_MAX_CCCDS=32
  -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=256
