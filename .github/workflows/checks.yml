name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge-and-firmware:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.11'
          python-version: '3.12'
      - run: uv sync --project bridge --frozen
      - run: uv run --project bridge python -m unittest discover -s bridge/tests -v
      - run: uv run --project bridge python hardware/enclosure/verify_stl.py
      - run: uvx --from platformio==6.1.18 --with pip platformio run --project-dir firmware
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "${BASE_SHA//0/}" ] || ! git diff --quiet "$BASE_SHA" HEAD -- ios; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.ios == 'true'
        run: brew install xcodegen
      - if: steps.changes.outputs.ios == 'true'
        run: xcodegen generate --spec ios/project.yml
      - if: steps.changes.outputs.ios == 'true'
        run: xcodebuild -project ios/EWP.xcodeproj -scheme EWP -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
